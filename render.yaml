services:
  - type: web
    name: prahari
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build && ls -la dist/ && cd .. && mkdir -p backend/static && cp -r frontend/dist/* backend/static/ && ls -la backend/static/
    startCommand: cd backend && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PRAHARI_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./prahari.db
      - key: GROQ_API_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: prahari-verify
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
